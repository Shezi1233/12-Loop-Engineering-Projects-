name: doorbell loop

# Event-driven loop: every PR that opens (or syncs) triggers a review.
# The reviewer never asked for it — the doorbell rang and it ran.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency: doorbell-${{ github.event.pull_request.number }}
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cd project-06-doorbell-loop && python reviewer.py
      - name: post review on PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(python project-06-doorbell-loop/reviewer.py | head -1)
          if [ "$RESULT" = "FAIL" ]; then
            gh pr review ${{ github.event.pull_request.number }} \
              --body "FAIL — found a planted issue" \
              --request-changes
          else
            gh pr review ${{ github.event.pull_request.number }} \
              --body "PASS — clean diff" \
              --approve
          fi