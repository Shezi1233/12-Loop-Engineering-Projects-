name: fix-loop

# Event-driven loop: on PR open, run the reviewer to grade the fix.
# If PASS, add a "passed-review" label. If FAIL, add "needs-work" + comment.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency: fix-loop-${{ github.event.pull_request.number }}
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cd project-04-fix-loop-real-checker && python reviewer.py buggy_math.py